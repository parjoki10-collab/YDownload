<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MSTFLIX — Movie & TV Library</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="header">

    <div class="logo">MST<span>FLIX</span></div>

    <div class="search-box">

      <input

        type="text"

        id="searchInput"

        placeholder="Search movies & TV series..."

      >

      <button id="searchBtn">🔍</button>

    </div>

  </header>

  <main>

    <section id="homePage">

      <div class="section">

        <div class="section-title">

          <h2>Trending Movies</h2>

        </div>

        <div id="trendingMovies" class="movie-grid"></div>

      </div>

      <div class="section">

        <div class="section-title">

          <h2>Popular Movies</h2>

        </div>

        <div id="popularMovies" class="movie-grid"></div>

      </div>

      <div class="section">

        <div class="section-title">

          <h2>Popular TV Series</h2>

        </div>

        <div id="popularTV" class="movie-grid"></div>

      </div>

    </section>

    <!-- SEARCH -->

 <section id="searchPage" class="hidden">

  <div class="search-header">

    <h2 id="searchTitle">Search Result</h2>

    <button id="closeSearch" class="close-btn">

      ✕

    </button>

  </div>

  <div id="searchResults" class="movie-grid"></div>

</section>

    <!-- DETAIL -->

    <section id="detailPage" class="hidden">

      <div id="detailContent"></div>

    </section>

  </main>

  <div id="loading" class="loading hidden">

    Loading...

  </div>

  <script src="script.js"></script>

</body>

</html>
