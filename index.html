<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="MSTFLIX — Movie & TV Library">
  <title>MSTFLIX — Movie & TV Library</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="logo">MST<span>FLIX</span></div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search movies & TV series..."
        autocomplete="off"
        aria-label="Search movies and TV series"
      >
      <button id="searchBtn" type="button" aria-label="Search">⌕</button>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="homePage">

      <!-- GENRES -->
      <section class="genre-section" aria-label="Browse by genre">
        <div class="genre-bar" id="genreBar">
          <button class="genre-chip active" type="button" data-genre="all">All</button>
          <button class="genre-chip" type="button" data-genre="action">Action</button>
          <button class="genre-chip" type="button" data-genre="comedy">Comedy</button>
          <button class="genre-chip" type="button" data-genre="horror">Horror</button>
          <button class="genre-chip" type="button" data-genre="scifi">Sci-Fi</button>
          <button class="genre-chip" type="button" data-genre="animation">Animation</button>
          <button class="genre-chip" type="button" data-genre="drama">Drama</button>
        </div>
      </section>

      <!-- FEATURED -->
      <section class="featured-section" aria-label="Featured">
        <div class="featured-card" id="featuredCard">
          <div class="featured-backdrop" id="featuredBackdrop"></div>
          <div class="featured-content">
            <div class="featured-kicker">Featured</div>
            <h1 class="featured-title" id="featuredTitle">MSTFLIX</h1>
            <div class="featured-meta" id="featuredMeta">Discover movies & TV series</div>
            <button class="featured-btn" id="featuredBtn" type="button">Explore Now</button>
          </div>
        </div>
      </section>

      <!-- TRENDING -->
      <div class="section">
        <div class="section-title">
          <h2>Trending Movies</h2>
          <button class="see-all" type="button" data-see-all="trendingMovies">See All ›</button>
        </div>
        <div id="trendingMovies" class="movie-grid"></div>
      </div>

      <!-- POPULAR MOVIES -->
      <div class="section">
        <div class="section-title">
          <h2>Popular Movies</h2>
          <button class="see-all" type="button" data-see-all="popularMovies">See All ›</button>
        </div>
        <div id="popularMovies" class="movie-grid"></div>
      </div>

      <!-- POPULAR TV -->
      <div class="section">
        <div class="section-title">
          <h2>Popular TV Series</h2>
          <button class="see-all" type="button" data-see-all="popularTV">See All ›</button>
        </div>
        <div id="popularTV" class="movie-grid"></div>
      </div>

      <!-- POPULAR THIS WEEK -->
      <div class="section">
        <div class="section-title">
          <h2>Popular This Week</h2>
          <button class="see-all" type="button" data-see-all="popularWeek">See All ›</button>
        </div>
        <div id="popularWeek" class="movie-grid"></div>
      </div>

    </section>

    <!-- SEARCH -->
    <section id="searchPage" class="hidden">
      <div class="search-header">
        <h2 id="searchTitle">Search Result</h2>
        <button id="closeSearch" class="close-btn" type="button" aria-label="Close search">✕</button>
      </div>
      <div id="searchResults" class="movie-grid"></div>
    </section>

    <!-- DETAIL -->
    <section id="detailPage" class="hidden">
      <div id="detailContent"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-logo">MST<span>FLIX</span></div>
    <div>Movies & TV Series Library</div>
    <div>© 2026 MSTFLIX</div>
  </footer>

  <!-- MOBILE NAV -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <button class="active" type="button" data-nav="home">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </button>
    <button type="button" data-nav="movies">
      <span class="nav-icon">▣</span>
      <span>Movies</span>
    </button>
    <button type="button" data-nav="tv">
      <span class="nav-icon">▤</span>
      <span>TV Series</span>
    </button>
    <button type="button" data-nav="search">
      <span class="nav-icon">⌕</span>
      <span>Search</span>
    </button>
  </nav>

  <div id="loading" class="loading hidden">
    <div class="loading-box">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
