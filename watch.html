<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — MSTFLIX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080b12;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 5%;
      background: rgba(8,11,18,.96);
      border-bottom: 1px solid #172033;
    }
    .logo { font-size: 23px; font-weight: 800; }
    .logo span { color: #2196ff; }
    .back {
      margin-left: auto;
      color: #aab4c4;
      text-decoration: none;
    }
    main {
      width: 92%;
      max-width: 1100px;
      margin: 25px auto;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 15px;
      word-break: break-word;
    }
    .player {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    button {
      border: 0;
      border-radius: 7px;
      padding: 12px 17px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .vlc { background: #fff; color: #111; }
    .backBtn { background: #1677d2; color: #fff; }
    .note {
      margin-top: 14px;
      color: #8994a7;
      font-size: 13px;
      line-height: 1.6;
    }
    .error {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 8px;
      background: #111827;
      color: #d0d5dd;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">MST<span>FLIX</span></div>
    <a class="back" href="javascript:history.back()">← Back</a>
  </header>

  <main>
    <h1 id="title">Loading...</h1>

    <div class="player">
      <video id="video" controls playsinline preload="metadata"></video>
    </div>

    <div class="actions">
      <button class="vlc" id="vlcButton">▶ Open in VLC</button>
      <button class="backBtn" onclick="history.back()">← Back</button>
    </div>

    <div class="note">
      Browser playback works when the authorized media server provides a
      browser-compatible format and supports HTTP range requests.
      VLC can be used when the installed VLC app supports the media URL.
    </div>

    <div class="error" id="error"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get("file") || "";
    const title = params.get("title") || "MSTFLIX";

    const titleEl = document.getElementById("title");
    const video = document.getElementById("video");
    const error = document.getElementById("error");
    const vlcButton = document.getElementById("vlcButton");

    titleEl.textContent = title;

    function showError(message) {
      error.textContent = message;
      error.style.display = "block";
    }

    if (!file) {
      showError("URL video belum dikonfigurasi.");
      vlcButton.disabled = true;
    } else {
      video.src = file;
    }

    vlcButton.addEventListener("click", () => {
      if (!file) return;

      // VLC for iOS supports opening network streams through its URL scheme
      // when the app is installed. If the scheme is not handled, iOS will
      // simply remain on the current page.
      const vlc = "vlc-x-callback://x-callback-url/stream?url=" +
                  encodeURIComponent(file);
      location.href = vlc;
    });

    video.addEventListener("error", () => {
      showError(
        "Video tidak bisa diputar di browser. Coba Open in VLC, " +
        "atau gunakan format yang didukung browser seperti MP4/HLS."
      );
    });
  </script>
</body>
</html>
